services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-postgres
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - hospital_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    ports:
      - "6379:6379"
    volumes:
      - hospital_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: hospital-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hospital:hospital@postgres:5432/hospital_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: docker-dev-access-secret-change-me
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-change-me
      CORS_ORIGIN: "*"
      EMBED_WORKER: "true"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node src/index.js"

  worker:
    build: .
    container_name: hospital-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://hospital:hospital@postgres:5432/hospital_db?schema=public
      JWT_ACCESS_SECRET: docker-dev-access-secret-change-me
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-change-me
      EMBED_WORKER: "false"
    command: ["node", "src/worker.js"]
    profiles:
      - full

volumes:
  hospital_pg_data:
  hospital_redis_data:
