name: CI

on:
  push:
    branches: [main, master, develop, 'p3/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: hospital
          POSTGRES_DB: hospital_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital -d hospital_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hospital:hospital@localhost:5432/hospital_db?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      REDIS_URL: ''
      EMBED_WORKER: 'false'
      SKIP_DB_TESTS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03-hospital-engineering/02-hospital-backend-copy/package-lock.json

      - name: Install
        working-directory: 03-hospital-engineering/02-hospital-backend-copy
        run: npm ci || npm install

      - name: Prisma generate & migrate
        working-directory: 03-hospital-engineering/02-hospital-backend-copy
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Unit + Integration tests
        working-directory: 03-hospital-engineering/02-hospital-backend-copy
        run: npm test
